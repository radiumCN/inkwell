  <rect x="635" y="800" width="100" height="4" rx="2" fill="#6A6A6E"/>

  <!-- 中间箭头 -->
  <line x1="438" y1="500" x2="508" y2="500" stroke="#8E8E93" stroke-width="1.6" marker-end="url(#arG)"/>
  <text x="473" y="488" font-size="11" fill="#8E8E93" text-anchor="middle">改版</text>

  <!-- ================= 右栏：方案说明 ================= -->
  <text x="920" y="176" font-size="15" font-weight="600" fill="#E5484D">现状问题</text>
  <text x="920" y="210" font-size="12.5" fill="#1A1A1C">下拉菜单平铺全部书源，数量一多只能一路滑；</text>
  <text x="920" y="232" font-size="12.5" fill="#1A1A1C">菜单从屏幕左上角展开，单手很难够到。</text>
  <text x="920" y="264" font-size="12.5" fill="#1A1A1C">没有搜索入口 —— 书源管理页有搜索，发现页没有。</text>
  <text x="920" y="296" font-size="12.5" fill="#1A1A1C">没有「最近使用」，常逛的源每次都要重新找。</text>
  <text x="920" y="328" font-size="12.5" fill="#1A1A1C">换源后分类强制归零：两个源都有「玄幻小说」也接不上。</text>

  <line x1="920" y1="358" x2="1380" y2="358" stroke="#DEDEE3" stroke-width="1"/>

  <text x="920" y="396" font-size="15" font-weight="600" fill="#277AF7">改进方案</text>

  <!-- 1 -->
  <line x1="920" y1="441" x2="866" y2="441" stroke="#277AF7" stroke-width="1.2" marker-end="url(#arSm)"/>
  <circle cx="932" cy="437" r="10" fill="#277AF7"/>
  <text x="932" y="441" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="952" y="435" font-size="13" font-weight="600" fill="#1A1A1C">底部「书源面板」替代下拉菜单</text>
  <text x="952" y="457" font-size="12" fill="#6E6E73">与阅读器「换源」同一形态，单手可达；</text>
  <text x="952" y="475" font-size="12" fill="#6E6E73">长列表在面板里正常滚动，不再挤在小菜单里。</text>

  <!-- 2 -->
  <line x1="920" y1="519" x2="866" y2="482" stroke="#277AF7" stroke-width="1.2" marker-end="url(#arSm)"/>
  <circle cx="932" cy="515" r="10" fill="#277AF7"/>
  <text x="932" y="519" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="952" y="513" font-size="13" font-weight="600" fill="#1A1A1C">搜索 + 「最近」置顶</text>
  <text x="952" y="535" font-size="12" fill="#6E6E73">搜索框与书源管理同款；最近用过的 3 个源置顶，</text>
  <text x="952" y="553" font-size="12" fill="#6E6E73">当前源打勾，点行即换。</text>

  <!-- 3 -->
  <line x1="920" y1="597" x2="866" y2="600" stroke="#277AF7" stroke-width="1.2" marker-end="url(#arSm)"/>
  <circle cx="932" cy="593" r="10" fill="#277AF7"/>
  <text x="932" y="597" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="952" y="591" font-size="13" font-weight="600" fill="#1A1A1C">面板可滚动，行式列表照抄内容列表规范</text>
  <text x="952" y="613" font-size="12" fill="#6E6E73">书源行：名称 +「N 个分类」副标题；</text>
  <text x="952" y="631" font-size="12" fill="#6E6E73">标题行尾「管理」直达书源管理（缺源/导入的出路）。</text>

  <!-- 4 -->
  <circle cx="932" cy="675" r="10" fill="#277AF7"/>
  <text x="932" y="679" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="952" y="673" font-size="13" font-weight="600" fill="#1A1A1C">切源保持同名分类</text>
  <text x="952" y="695" font-size="12" fill="#6E6E73">新源里有同名分类就停在它上面；</text>
  <text x="952" y="713" font-size="12" fill="#6E6E73">不同名才回到第一个分类。</text>

  <!-- 分类保持示意 -->
  <rect x="920" y="748" width="460" height="112" rx="12" fill="#FFFFFF" stroke="#E2E2E7" stroke-width="1"/>
  <rect x="936" y="768" width="76" height="26" rx="13" fill="#24406B"/>
  <text x="974" y="785" font-size="11" fill="#6BA3FF" text-anchor="middle">玄幻小说</text>
  <rect x="1020" y="768" width="76" height="26" rx="13" fill="#EDEDF0"/>
  <text x="1058" y="785" font-size="11" fill="#6E6E73" text-anchor="middle">修真小说</text>
  <text x="1122" y="786" font-size="11" fill="#8E8E93">切源前</text>
  <line x1="1180" y1="781" x2="1226" y2="781" stroke="#8E8E93" stroke-width="1.4" marker-end="url(#arG)"/>
  <rect x="1244" y="768" width="76" height="26" rx="13" fill="#24406B"/>
  <text x="1282" y="785" font-size="11" fill="#6BA3FF" text-anchor="middle">玄幻小说</text>
  <rect x="1328" y="768" width="40" height="26" rx="13" fill="#EDEDF0"/>
  <text x="1348" y="785" font-size="11" fill="#6E6E73" text-anchor="middle">…</text>
  <text x="936" y="826" font-size="11" fill="#6E6E73">同名的「玄幻小说」保持选中，切源不打断浏览心流</text>
  <text x="936" y="846" font-size="11" fill="#8E8E93">入口不变：顶栏「书源名 + ⇅」仍是开关，学习成本为零</text>

  <!-- 范围外 -->
  <text x="920" y="896" font-size="11" fill="#8E8E93">范围外：书源分组筛选、置顶/收藏（「最近」已覆盖高频场景）、横滑切源手势</text>
  <text x="920" y="918" font-size="11" fill="#8E8E93">加载 / 空态 / 错误态沿用现有 LoadingState · EmptyState · ErrorState</text>
</svg>
