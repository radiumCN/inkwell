  <rect x="804" y="209" width="9" height="4" rx="1" fill="#FFFFFF"/>

  <!-- 背景页（压暗） -->
  <path d="M560 252 L550 260 L560 268" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="576" y="265" font-size="14" fill="#FFFFFF">97小说/无限小说网</text>
  <path d="M790 254 L795 249 L800 254 M790 266 L795 271 L800 266" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="546" y="286" width="66" height="28" rx="14" fill="#24406B"/>
  <text x="579" y="304" font-size="11" fill="#6BA3FF" text-anchor="middle">玄幻小说</text>
  <rect x="620" y="286" width="66" height="28" rx="14" fill="#2C2C2E"/>
  <text x="653" y="304" font-size="11" fill="#D8D8DC" text-anchor="middle">修真小说</text>
  <rect x="694" y="286" width="66" height="28" rx="14" fill="#2C2C2E"/>
  <text x="727" y="304" font-size="11" fill="#D8D8DC" text-anchor="middle">都市小说</text>
  <rect x="546" y="332" width="278" height="124" rx="12" fill="#1C1C1E"/>
  <rect x="560" y="344" width="34" height="46" rx="4" fill="#2E2E32"/>
  <text x="606" y="360" font-size="11" fill="#FFFFFF">凡人修仙传</text>
  <text x="606" y="377" font-size="9" fill="#8E8E93">忘语 · 最新：第两千三百章</text>
  <rect x="560" y="414" width="34" height="46" rx="4" fill="#2E2E32"/>
  <text x="606" y="430" font-size="11" fill="#FFFFFF">修真聊天群</text>
  <text x="606" y="447" font-size="9" fill="#8E8E93">圣骑士的传说 · 更新至 1892 章</text>

  <!-- 压暗层 -->
  <rect x="536" y="184" width="298" height="638" rx="28" fill="#000000" opacity="0.55"/>

  <!-- 底部书源面板 -->
  <path d="M536 822 V416 Q536 396 556 396 H814 Q834 396 834 416 V822 Z" fill="#111113"/>
  <rect x="665" y="408" width="36" height="4" rx="2" fill="#5A5A5E"/>
  <text x="556" y="444" font-size="15" font-weight="600" fill="#FFFFFF">切换书源</text>
  <text x="818" y="443" font-size="12" fill="#6BA3FF" text-anchor="end">管理</text>

  <!-- 搜索框 -->
  <rect x="552" y="462" width="266" height="34" rx="10" fill="#2A2A2E"/>
  <circle cx="570" cy="478" r="5" fill="none" stroke="#8E8E93" stroke-width="1.4"/>
  <line x1="574" y1="482" x2="578" y2="486" stroke="#8E8E93" stroke-width="1.4" stroke-linecap="round"/>
  <text x="588" y="483" font-size="11" fill="#8E8E93">搜索书源名称或网址</text>

  <!-- 最近 -->
  <text x="556" y="518" font-size="10" fill="#8E8E93">最近</text>
  <rect x="552" y="528" width="266" height="128" rx="12" fill="#1E1E22"/>
  <text x="566" y="552" font-size="11" fill="#FFFFFF">97小说/无限小说网</text>
  <text x="566" y="566" font-size="9" fill="#8E8E93">8 个分类</text>
  <text x="802" y="554" font-size="11" fill="#6BA3FF" text-anchor="end">✓</text>
  <line x1="566" y1="578" x2="804" y2="578" stroke="#2A2A2E" stroke-width="1"/>
  <text x="566" y="602" font-size="11" fill="#FFFFFF">笔趣阁</text>
  <text x="566" y="616" font-size="9" fill="#8E8E93">12 个分类</text>
  <line x1="566" y1="628" x2="804" y2="628" stroke="#2A2A2E" stroke-width="1"/>
  <text x="566" y="644" font-size="11" fill="#FFFFFF">番茄小说</text>
  <text x="566" y="656" font-size="9" fill="#8E8E93">6 个分类</text>

  <!-- 全部书源 -->
