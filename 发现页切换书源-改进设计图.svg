  <circle cx="852" cy="441" r="10" fill="#277AF7"/>
  <text x="852" y="445" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="852" cy="479" r="10" fill="#277AF7"/>
  <text x="852" y="483" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="852" cy="600" r="10" fill="#277AF7"/>
  <text x="852" y="604" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>

