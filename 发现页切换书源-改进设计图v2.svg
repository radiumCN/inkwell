  <circle cx="932" cy="239" r="10" fill="#277AF7"/>
  <text x="932" y="243" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="952" y="237" font-size="13" font-weight="600" fill="#1A1A1C">切源入口沉到底部玻璃胶囊</text>
  <text x="952" y="259" font-size="12" fill="#6E6E73">FloatingGlassBar —— 与书架隐藏区隐私胶囊同组件、</text>
