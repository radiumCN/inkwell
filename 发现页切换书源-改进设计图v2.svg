  <text x="932" y="343" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="952" y="337" font-size="13" font-weight="600" fill="#1A1A1C">顶栏回归大标题「发现」</text>
  <text x="952" y="359" font-size="12" fill="#6E6E73">切源挪走后标题位不再放按钮，换回标准 AppTopBar；</text>
  <text x="952" y="377" font-size="12" fill="#6E6E73">分类 chips 照旧钉在顶栏，随列表滚动在玻璃下。</text>

